name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Real PostgreSQL, not SQLite: the exclusion constraint, the
        # btree_gist extension and the parallel-booking tests exercise
        # behavior SQLite cannot reproduce.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: book_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/book_ci
      DJANGO_SECRET_KEY: ci-not-secret
      PAYSTACK_SECRET_KEY: sk_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Fail if models drifted from migrations.
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - run: pytest -q
